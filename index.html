      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sgtoilets_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8ff] text-[#131b2e] dark:bg-[#0b1120] dark:text-slate-100 antialiased selection:bg-[#0D8B99]/20">

  </body>
